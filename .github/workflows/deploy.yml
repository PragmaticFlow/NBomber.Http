name: deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    environment: PROD
    runs-on: ubuntu-latest
    permissions:
        contents: read
        id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Pack
      run: dotnet pack src/NBomber.Http/NBomber.Http.fsproj -c Release -o artifacts --include-source

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish
      run: dotnet nuget push artifacts/**.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
